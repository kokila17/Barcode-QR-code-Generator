                            size: qrSize.value,
                            color: qrColor.value,
                            bgColor: qrBgColor.value,
                            errorCorrection: qrErrorCorrection.value
                        }
                    };
                    addToHistory(historyItem);
                }
            }
            qrLoading.style.display = 'none';
        } catch (error) {
            console.error(error);
            qrcodeDiv.innerHTML = '<div class="alert alert-danger">Error generating QR code</div>';
            qrLoading.style.display = 'none';
        }
    }, 500);
});
// ...existing code...
            
            // Download QR as PNG
            downloadQrPng.addEventListener('click', function() {
                const canvas = qrcodeDiv.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'qrcode.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            });
            
            // Download QR as JPG
            downloadQrJpg.addEventListener('click', function() {
                const canvas = qrcodeDiv.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'qrcode.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                }
            });
            
            // Download QR as PDF
            downloadQrPdf.addEventListener('click', function() {
                const canvas = qrcodeDiv.querySelector('canvas');
                if (canvas) {
                    const pdf = new jsPDF();
                    const imgData = canvas.toDataURL('image/png');
                    const imgWidth = 50;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    
                    pdf.addImage(imgData, 'PNG', (pdf.internal.pageSize.getWidth() - imgWidth) / 2, 40, imgWidth, imgHeight);
                    pdf.text('QR Code: ' + qrText.value, 10, 20);
                    pdf.save('qrcode.pdf');
                }
            });
            
            // Generate Barcode
            barcodeForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const text = barcodeText.value.trim();
                if (!text) {
                    alert('Please enter content to encode');
                    return;
                }
                
                // Show loading animation
                barcodeSvg.innerHTML = '';
                barcodeLoading.style.display = 'block';
                barcodeDownloadOptions.style.display = 'none';
                
                // Generate barcode
                setTimeout(() => {
                    try {
                        barcodeSvg.innerHTML = '';
                        JsBarcode(barcodeSvg, text, {
                            format: barcodeType.value,
                            lineColor: barcodeColor.value,
                            width: parseInt(barcodeWidth.value),
                            height: parseInt(barcodeHeight.value),
                            displayValue: barcodeDisplayValue.value === 'true',
                            margin: 10,
                            background: 'transparent'
                        });
                        
                        // Success
                        barcodeDownloadOptions.style.display = 'flex';
                        
                        // Save to history if enabled
                        if (saveBarcodeHistory.checked) {
                            const serializer = new XMLSerializer();
                            const svgStr = serializer.serializeToString(barcodeSvg);
                            const svgData = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
                            
                            const historyItem = {
                                type: 'barcode',
                                content: text,
                                timestamp: new Date().toISOString(),
                                dataUrl: svgData,
                                settings: {
                                    type: barcodeType.value,
                                    color: barcodeColor.value,
                                    width: barcodeWidth.value,
                                    height: barcodeHeight.value,
                                    displayValue: barcodeDisplayValue.value
                                }
                            };
                            addToHistory(historyItem);
                        }
                        
                        barcodeLoading.style.display = 'none';
                    } catch (error) {
                        console.error(error);
                        barcodeSvg.innerHTML = '<div class="alert alert-danger">Error generating barcode: ' + error.message + '</div>';
                        barcodeLoading.style.display = 'none';
                    }
                }, 500);
            });
            
            // Download Barcode as PNG
            downloadBarcodePng.addEventListener('click', function() {
                if (barcodeSvg.innerHTML.trim() === '') return;
                
                const serializer = new XMLSerializer();
                const svgStr = serializer.serializeToString(barcodeSvg);
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const link = document.createElement('a');
                    link.download = 'barcode.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
                
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
            });
            
            // Download Barcode as JPG
            downloadBarcodeJpg.addEventListener('click', function() {
                if (barcodeSvg.innerHTML.trim() === '') return;
                
                const serializer = new XMLSerializer();
                const svgStr = serializer.serializeToString(barcodeSvg);
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const link = document.createElement('a');
                    link.download = 'barcode.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                };
                
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
            });
            
            // Download Barcode as PDF
            downloadBarcodePdf.addEventListener('click', function() {
                if (barcodeSvg.innerHTML.trim() === '') return;
                
                const serializer = new XMLSerializer();
                const svgStr = serializer.serializeToString(barcodeSvg);
                const svgData = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const pdf = new jsPDF();
                    const imgWidth = 100;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    
                    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 
                                (pdf.internal.pageSize.getWidth() - imgWidth) / 2, 40, 
                                imgWidth, imgHeight);
                    pdf.text('Barcode: ' + barcodeText.value, 10, 20);
                    pdf.save('barcode.pdf');
                };
                
                img.src = svgData;
            });
            
            // Toggle history visibility
            toggleHistoryBtn.addEventListener('click', function() {
                if (historyContainer.style.display === 'none' || !historyContainer.style.display) {
                    historyContainer.style.display = 'block';
                    toggleHistoryBtn.innerHTML = '<i class="fas fa-history me-1"></i> Hide Generation History';
                } else {
                    historyContainer.style.display = 'none';
                    toggleHistoryBtn.innerHTML = '<i class="fas fa-history me-1"></i> Show Generation History';
                }
            });
            
            // Clear history
            clearHistory.addEventListener('click', function() {
                if (confirm('Are you sure you want to clear all generation history?')) {
                    generationHistory = [];
                    localStorage.setItem('generationHistory', JSON.stringify(generationHistory));
                    renderHistory();
                }
            });
            
            // Add item to history
            function addToHistory(item) {
                generationHistory.unshift(item); // Add to beginning
                if (generationHistory.length > 20) {
                    generationHistory.pop(); // Keep only last 20 items
                }
                localStorage.setItem('generationHistory', JSON.stringify(generationHistory));
                renderHistory();
            }
            
            // Render history items
            function renderHistory() {
                historyItems.innerHTML = '';
                
                if (generationHistory.length === 0) {
                    historyItems.innerHTML = '<div class="alert alert-info">No generation history yet</div>';
                    return;
                }
                
                generationHistory.forEach((item, index) => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    
                    const typeIcon = item.type === 'qr' ? 
                        '<i class="fas fa-qrcode" style="color: #4285F4; font-size: 24px;"></i>' : 
                        '<i class="fas fa-barcode" style="color: #34A853; font-size: 24px;"></i>';
                    
                    const date = new Date(item.timestamp);
                    const formattedDate = date.toLocaleString();
                    
                    historyItem.innerHTML = `
                        ${typeIcon}
                        <div class="content">
                            <strong>${item.content}</strong><br>
                            <small class="text-muted">${formattedDate}</small>
                        </div>
                        <img src="${item.dataUrl}" alt="${item.type}">
                        <div class="actions">
                            <button class="btn btn-sm btn-google-secondary view-history" data-index="${index}">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-google download-history" data-index="${index}">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    `;
                    
                    historyItems.appendChild(historyItem);
                });
                
                // Add event listeners to view buttons
                document.querySelectorAll('.view-history').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = this.getAttribute('data-index');
                        const item = generationHistory[index];
                        
                        if (item.type === 'qr') {
                            // Switch to QR tab
                            document.getElementById('qr-tab').click();
                            // Fill form with history settings
                            qrText.value = item.content;
                            qrSize.value = item.settings.size;
                            qrColor.value = item.settings.color;
                            qrBgColor.value = item.settings.bgColor;
                            qrErrorCorrection.value = item.settings.errorCorrection;
                            // Submit form to regenerate
                            qrForm.dispatchEvent(new Event('submit'));
                        } else {
                            // Switch to Barcode tab
                            document.getElementById('barcode-tab').click();
                            // Fill form with history settings
                            barcodeText.value = item.content;
                            barcodeType.value = item.settings.type;
                            barcodeColor.value = item.settings.color;
                            barcodeWidth.value = item.settings.width;
                            barcodeHeight.value = item.settings.height;
                            barcodeDisplayValue.value = item.settings.displayValue.toString();
                            // Submit form to regenerate
                            barcodeForm.dispatchEvent(new Event('submit'));
                        }
                    });
                });
                
                // Add event listeners to download buttons
                document.querySelectorAll('.download-history').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = this.getAttribute('data-index');
                        const item = generationHistory[index];
                        
                        const link = document.createElement('a');
                        link.download = ${item.type}_${new Date(item.timestamp).getTime()}.png;
                        link.href = item.dataUrl;
                        link.click();
                    });
                });
            }
            
            // Reset forms
            document.querySelectorAll('button[type="reset"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const form = this.closest('form');
                    const downloadOptions = form.nextElementSibling.querySelector('.download-options');
                    downloadOptions.style.display = 'none';
                    
                    if (form.id === 'qrForm') {
                        qrcodeDiv.innerHTML = '';
                    } else {
                        barcodeSvg.innerHTML = '';
                    }
                });
            });
        });
    </script>
